name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: Laravel tests and frontend build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: dom, curl, fileinfo, filter, libxml, mbstring, xmlreader, zip, pdo, sqlite3, pdo_sqlite
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Install Node dependencies
        run: npm ci

      - name: Prepare environment
        run: cp .env.example .env

      - name: Create SQLite database
        run: touch database/database.sqlite

      - name: Prepare Laravel storage
        run: mkdir -p storage/framework/cache/data storage/framework/sessions storage/framework/testing storage/framework/views storage/logs

      - name: Generate application key
        run: php artisan key:generate --ansi

      - name: Run migrations
        run: php artisan migrate --force

      - name: Run tests
        run: php artisan test

      - name: Build frontend assets
        run: npm run build

  postgres-migrations:
    name: PostgreSQL migration compatibility
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: vetflow
          POSTGRES_USER: vetflow
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vetflow -d vetflow"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: dom, curl, fileinfo, filter, intl, libxml, mbstring, pdo, pdo_pgsql, xmlreader, zip
          coverage: none

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare PostgreSQL environment
        run: |
          cp .env.example .env
          php artisan key:generate --ansi
          sed -i 's/^DB_CONNECTION=.*/DB_CONNECTION=pgsql/' .env
          sed -i 's/^DB_DATABASE=.*/DB_DATABASE=vetflow/' .env
          printf '\nDB_HOST=127.0.0.1\nDB_PORT=5432\nDB_USERNAME=vetflow\nDB_PASSWORD=\n' >> .env

      - name: Run PostgreSQL migrations
        run: php artisan migrate --force

      - name: Verify PostgreSQL migration status
        run: php artisan migrate:status
