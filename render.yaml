services:
  - type: web
    name: vetflow-demo
    runtime: docker
    repo: https://github.com/ruanjardim/VetFlow
    branch: deploy/render
    region: virginia
    plan: free
    healthCheckPath: /up
    autoDeployTrigger: off
    maxShutdownDelaySeconds: 30
    envVars:
      - key: APP_NAME
        value: VetFlow
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: info
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: SESSION_SAME_SITE
        value: lax
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: FILESYSTEM_DISK
        value: local
      - key: VETFLOW_SEED_DEMO_USER
        value: "false"
      - key: VETFLOW_QUEUE_MODE
        value: worker
      - key: VETFLOW_QUEUE_CRON_ENABLED
        value: "false"
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_SSLMODE
        value: prefer
      - key: TRUSTED_PROXIES
        value: "*"
      - key: APP_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
